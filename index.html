<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NFT-Gated AI Chat — Cyberpets</title>

<style>
:root{
  --bg:#0b1020;
  --muted:#94a3b8;
  --accent:#7c3aed;
  --glass: rgba(255,255,255,0.03);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system;
}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:#e6eef8;
  overflow:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:url('https://gold-junior-swordfish-840.mypinata.cloud/ipfs/bafkreihgxaa3mbxkm6db7o3yoa6zekht7lmg5atp7inxkhifdy6p3nxjui') center/cover no-repeat;
  opacity:0.6;
  pointer-events:none;
  z-index:0;
}

.app{
  max-width:720px;
  margin:0 auto;
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}

header{
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{font-weight:700;font-size:24px;}
.subtitle{font-size:14px;color:var(--muted);}

.send{
  background:linear-gradient(135deg,#06b6d4,#7c3aed);
  border:none;
  padding:10px 14px;
  border-radius:12px;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.send.blink{ animation: blink 1.2s infinite; }
@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.4} }

.pfp-overlay{
  position:fixed;
  top:20px;
  right:20px;
  width:100px;
  height:100px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(255,255,255,0.15);
  background:var(--glass);
  z-index:20;
}
.pfp-overlay img{width:100%;height:100%;object-fit:cover;}

.nft-status{
  position:fixed;
  top:130px;
  right:30px;
  width:80px;
  height:15px;
  background:rgba(255,255,255,0.12);
  border-radius:3px;
  overflow:hidden;
  z-index:20;
}
.nft-status-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#16f5a6,#f43f5e);
  transition:width .3s ease;
}
.nft-status-fill.pulse{ animation:pulse 1s infinite; }
@keyframes pulse{ 0%{filter:brightness(1)} 50%{filter:brightness(1.6)} 100%{filter:brightness(1)} }

/* NFT Carousel */
.nft-selector{
  position:fixed;
  top:150px;
  right:20px;
  display:flex;
  flex-direction:column;   /* ⬅️ vertical */
  gap:10px;
  max-height:calc(100vh - 140px);
  overflow-y:auto;         /* ⬅️ vertical scroll */
  padding-right:4px;
  z-index:21;
}
.nft-selector::-webkit-scrollbar{ height:6px; }
.nft-selector::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.25);
  border-radius:4px;
}
.nft-selector img{
  width:56px;
  height:56px;
  border-radius:14px;
  object-fit:cover;
  border:2px solid rgba(255,255,255,0.15);
  cursor:pointer;
  transition:all 0.2s ease;
}
.nft-selector img.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(124,58,237,.35);
  transform:scale(1.08);
}

/* CHAT */
main.chat-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
  padding-bottom:240px;
}

.messages{ display:flex; flex-direction:column; gap:10px; }

.msg{
  max-width:86%;
  padding:12px;
  border-radius:14px;
  font-size:15px;
}

.msg.ai{ background:rgba(17,24,39,0.75); }
.msg.user{
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  align-self:flex-end;
  color:white;
}

.meta{ font-size:12px; color:var(--muted); margin-bottom:6px; }

/* COMPOSER */
.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:14px;
  display:flex;
  gap:8px;
  background:linear-gradient(180deg,rgba(11,16,32,.6),rgba(7,10,18,.85));
  backdrop-filter:blur(12px);
}

.input{
  flex:1;
  background:transparent;
  border:1px solid rgba(255,255,255,.12);
  padding:12px;
  border-radius:14px;
  color:inherit;
}

.avatar{
  position:absolute;
  width:300px;       /* 🔧 change here */
  height:300px;      /* 🔧 change here */
  pointer-events:none;
  animation:bounce 1s ease-in-out infinite alternate;
  z-index:1;
}

/* Mobile scaling */
@media (max-width: 640px) {
  .avatar{
    width:200px;
    height:200px;
  }
}
.avatar.typing{ animation:bounce .3s infinite alternate; }
@keyframes bounce{ from{transform:translateY(0)} to{transform:translateY(-10px)} }

.loading-spinner{
  width:24px;height:24px;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* Make PFP clickable */
.pfp-overlay {
  cursor: pointer;
  transition: transform 0.15s ease;
}
.pfp-overlay:hover {
  transform: scale(1.05);
}

/* Dropdown container */
.nft-dropdown {
  position: fixed;
  top: 88px;
  right: 12px;
  width: 220px;
  max-height: 360px;
  background: rgba(11,16,32,0.95);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.45);
  z-index: 30;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: dropdownIn 0.18s ease-out;
}

@keyframes dropdownIn {
  from { opacity:0; transform: translateY(-8px) scale(0.98); }
  to { opacity:1; transform: none; }
}

.nft-dropdown.hidden {
  display: none;
}

.nft-dropdown-header {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* Vertical selector list */
.nft-dropdown-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  overflow-y: auto;
}

/* NFT item */
.nft-dropdown-list img {
  width: 100%;
  height: 48px;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.08);
  transition: all 0.15s ease;
}

.nft-dropdown-list img:hover {
  transform: translateX(2px);
  border-color: rgba(124,58,237,0.6);
}

.nft-dropdown-list img.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(124,58,237,0.4);
}
@media (max-width: 640px) {
  .nft-status {
    position: relative;
    top: auto;
    right: auto;
    width: 80%;
    margin: 0 auto 12px auto;
    z-index: 1;
  }
}
@media (max-width: 640px) {
  .pfp-overlay {
    position: relative;
    top: auto;
    right: auto;
    left: auto;

    width: 96px;
    height: 96px;

    margin: 12px auto 8px auto;

    z-index: 1;
  }
}
/* Collect New CTA */
.collect-new {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  width: 100%;
  padding: 14px 12px;
  margin-top: 12px;

  border-radius: 14px;
  text-decoration: none;

  background: linear-gradient(135deg, #06b6d4, #7c3aed);
  color: white;
  font-weight: 800;
  font-size: 14px;

  animation: blink 1.2s infinite;
}

.collect-new span {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.85;
  margin-top: 4px;
}

/* Optional hover polish */
.collect-new:hover {
  transform: translateY(-1px);
  filter: brightness(1.05);
}
.nft-item{
  position: relative;
  display: inline-block;
}
/*Nft rarity Badge*/
.rarity-badge {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  color:#0f172a;
  font-weight:700;
  margin-top:6px;
}

.rarity-percent {
  font-weight:600;
  opacity:.9;
}

.trait-tags {
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}

.trait-tag {
  font-size:10px;
  padding:3px 6px;
  border-radius:999px;
  background:#1e293b;
  color:#e5e7eb;
  opacity:.85;
}


/* v1.3 compact responsive UI: one LinkLink conversation, expandable tool panels */
header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 12px}
header .send{margin-left:0!important;min-height:38px}
#connectBtn{margin-left:auto!important;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#agentPanel{margin:8px;padding:12px;border:1px solid #376a64;background:#10242a;border-radius:12px;color:#e5f7f0;max-height:50vh;overflow:auto;position:relative;z-index:5}
.agent-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.agent-choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.agent-choices button,#agentClose{min-height:42px;padding:8px 12px;border:1px solid #55a89b;border-radius:8px;background:#183b3d;color:#f3fff8;cursor:pointer}
.agent-choices button:disabled{opacity:.5}
#agentStats,#agentInventory,#agentMission{padding:6px 0;line-height:1.5}
#agentNotice{font-size:12px;color:#b1e8cb}
@media(max-width:600px){header{gap:5px}header .brand{font-size:18px}header .subtitle{font-size:10px}header .send{font-size:12px;padding:7px 9px}#adventurePanel{max-height:48vh!important;margin:5px!important;padding:9px!important}#agentPanel{max-height:48vh}#advAction{min-height:42px}.composer{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style>
</head>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<body>
<div class="app">
<header>
  <div>
    <div class="brand">Cyberpets AI</div>
    <div class="subtitle">LinkLink · Containment Protocol</div>
  </div>
  <button id="agentBtn" class="send" type="button" title="Agent status">Agent</button>
  <button id="adventureBtn" class="send" style="margin-left:6px" title="Open LinkLink Adventures">Missions</button>
  <button id="memoryBtn" class="send" style="margin-left:6px" title="Collector memory settings">Memory</button>
  <button id="connectBtn" class="send blink" style="margin-left:auto">Connect Wallet</button>
</header>

<div class="pfp-overlay" id="pfpToggle">
  <img id="pfpImg" />
</div>

<div class="nft-dropdown hidden" id="nftDropdown">
  <div class="nft-dropdown-list" id="nftSelector"></div>
</div>

<div class="nft-status"><div id="nftStatusFill" class="nft-status-fill"></div></div>


<section id="agentPanel" class="hidden" aria-label="Containment Agent status">
  <div class="agent-heading"><strong>Containment Agent</strong><button id="agentClose" type="button">Close</button></div>
  <div id="agentStats" aria-live="polite">Authenticate your wallet to load agent progress.</div>
  <div id="agentMission"></div><div id="agentChoices" class="agent-choices"></div>
  <div id="agentInventory"></div><div id="agentNotice" role="status"></div>
</section>
<section id="adventurePanel" class="hidden" style="padding:12px;max-height:75vh;overflow:auto;background:#101820;color:#e9f5ee;border:1px solid #2c6155;border-radius:12px;margin:8px;position:relative;z-index:5">
 <h3 style="margin:4px 0">LinkLink · Freeform Adventure <small style="font-weight:normal">· RPG Mode</small></h3>
 <div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px">
  <select id="advList" aria-label="Saved adventures" style="max-width:180px"><option value="">New adventure</option></select>
  <button id="advOpen">Load / Start</button><button id="advCheckpoint">Checkpoint</button><button id="advRestore">Restore</button>
  <label><input type="checkbox" id="advSave" checked> Save progress</label><button id="advClose">Close adventure</button>
 </div>
 <div id="advStatus" style="font-size:12px;color:#a9c7b9">Connect a wallet to begin.</div>
 <pre id="advState" style="white-space:pre-wrap;font-size:12px;max-height:110px;overflow:auto"></pre>
 <div id="advStory" role="log" aria-live="polite" style="white-space:pre-wrap;max-height:35vh;overflow:auto;padding:10px;background:#192b31;border-radius:8px;margin:8px 0"></div>
 <div style="display:flex;gap:6px"><input id="advAction" maxlength="1200" placeholder="What do you do?" style="flex:1;min-width:0"><button id="advSend">Act</button></div>
 </section>
<main class="chat-area" aria-label="LinkLink conversation">
  <div class="messages" id="messages"></div>
</main>

<div class="composer">
  <input id="input" class="input" disabled placeholder="Ask Your CyberpetAi Anything..." />
  <button id="send" class="send" disabled>Send</button>
</div>

<div class="avatar" id="avatar">
  <img id="avatarImg" src="https://gold-junior-swordfish-840.mypinata.cloud/ipfs/bafybeicojgyw7ljubtvypesetlfu6np3yiegoskrubpqbtnfyb4z3qptc4" />
</div>


<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>
const CONFIG = {
  NFT_CONTRACT: "0x1C37df48Fa365B1802D0395eE9F7Db842726Eb81",
  NFT_TOKEN_ID: null,
  API_BASE: "",
  ENABLE_SESSION_RESTORE: true // ⬅️ disable missing endpoint
};

//-----------DOMs lookup---------------
const connectBtn = document.getElementById('connectBtn');
const sendBtn = document.getElementById('send');
const inputEl = document.getElementById('input');
const messages = document.getElementById('messages');
const nftFill = document.getElementById('nftStatusFill');
const pfpImg = document.getElementById('pfpImg');
const nftSelectorEl = document.getElementById('nftSelector');
const DEFAULT_PFP =
  'https://gold-junior-swordfish-840.mypinata.cloud/ipfs/bafybeiejwxn2wb3rnw6qi5ahwd64zmj7ufhhgnbgw7x2bl4ag4zeabglzm';

const pfpToggle = document.getElementById('pfpToggle');
const nftDropdown = document.getElementById('nftDropdown');

let avatar = document.getElementById('avatar');
let web3Provider = null;
let signer = null;
let userAddress = null;
let prompts = 0;

let hasNFTAccess = false;
let authAnnounced = false;

let ownedNFTs = [];
let activeNFT = null;

let rarityTable = new Map();

if (pfpImg) {
  pfpImg.src = DEFAULT_PFP;
}

/* ---------------- UTIL ---------------- */
function scrollBottom(){
  messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
}

function escapeHtml(u=''){
  return String(u)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('\n','<br/>');
}

function bindAvatarTo(el){
  if(!avatar || !el) return;
  const msgRect = el.getBoundingClientRect();
  const appRect = document.querySelector('.app').getBoundingClientRect();
  const composerRect = document.querySelector('.composer').getBoundingClientRect();

  // Adjust top so avatar doesn't go below composer
  let top = msgRect.top - appRect.top - 100;
  const maxTop = composerRect.top - appRect.top - avatar.offsetHeight - 100;
  if(top > maxTop) top = maxTop;
  if(top < 0) top = 0;

  avatar.style.left = '-200px';  // distance from chat area, adjust as needed-----------------------------------------------------
  avatar.style.top = top + 'px';
  avatar.style.position = 'absolute';
  avatar.style.zIndex = 1;
}

function updateFloatingAvatar(tokenId){
  if(!avatar) return;

  avatar.innerHTML = '';

  const url = resolveAvatarUrlFromToken(tokenId) || DEFAULT_PFP;

  // Remove any previous image
  avatar.innerHTML = '';

  // Create new image
  const img = document.createElement('img');
  img.src = url;
  img.style.width = '100%';
  img.style.height = '100%';
  img.style.objectFit = 'contain';
  img.style.opacity = 0;
  img.style.transition = 'opacity 0.3s ease';

  avatar.appendChild(img);

  // Fade-in
  setTimeout(()=>{ img.style.opacity = 1; }, 50);
}


//---------push----------
function push(who, text){
  const m = document.createElement('div');
  m.className = 'msg ' + (who === 'User' ? 'user' : 'ai');

  m.innerHTML = `<div class="meta">${who}</div>${text}`;
  messages.appendChild(m);
  scrollBottom();

  if(who !== 'User' && avatar){
    requestAnimationFrame(()=>bindAvatarTo(m));
  }
  return m;
}

// 🔒 PFP SAFETY LOCK
const setPfp = (url) => {
  if (typeof url === 'string') {
    pfpImg.src = url;
  }
};

function incrementNFTStatus(){
  prompts++;
  nftFill.style.width = Math.min(prompts*10,100)+'%';
  if(prompts>=10) nftFill.classList.add('pulse');
}

/* ---------------- NFT DROPDOWN TOGGLE ---------------- */
pfpToggle?.addEventListener('click', (e) => {
  e.stopPropagation();
  nftDropdown?.classList.toggle('hidden');
});

document.addEventListener('click', (e) => {
  if (
    nftDropdown &&
    !nftDropdown.contains(e.target) &&
    !pfpToggle.contains(e.target)
  ) {
    nftDropdown.classList.add('hidden');
  }
});

//-------------Collect new NFT Button------------
function appendCollectNewButton(container){
  if (!container) return;

  // Prevent duplicates
  if (container.querySelector('.collect-new')) return;

  const a = document.createElement('a');
  a.href = 'https://opensea.io/collection/cyberpetsai';
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.className = 'collect-new';

  a.innerHTML = `
    Collect New
    <span>Go To OpenSea.io</span>
  `;

  container.appendChild(a);
}

function getRarityFromTable(tokenId) {
  const r = rarityTable.get(tokenId.toString());
  if (!r || !r.rank) {
    return { label:'Common', color:'#9ca3af', percent:null };
  }

  const rank = Number(r.rank);
  const total = rarityTable.size;

  const pct = (1 - rank / total) * 100;

  let label = 'Common';
  let color = '#9ca3af';

  if (rank <= total * 0.02) {
    label = 'Legendary'; color = '#f59e0b';
  } else if (rank <= total * 0.05) {
    label = 'Epic'; color = '#8b5cf6';
  } else if (rank <= total * 0.15) {
    label = 'Rare'; color = '#3b82f6';
  } else if (rank <= total * 0.35) {
    label = 'Uncommon'; color = '#22c55e';
  }

  return { label, color, percent: pct };
}

function aiReactToNFTSwitch(nft){
  if(!nft) return;

  const rarityData = rarityTable.get(nft.tokenId.toString());
  const rarityText = rarityData ? `Rarity: ${rarityData.rarity_percent.toFixed(1)}% (Rank #${rarityData.rank})` : '';

  const traitSummary = (nft.traits || [])
    .slice(0,3)
    .map(t => `${t.trait_type}: ${t.value}`)
    .join(', ');

  const lines = [
    `🔄 Cyberpet switched.`,
    `<b>${escapeHtml(nft.name)}</b> is now active.`,
    traitSummary ? `Key traits: ${escapeHtml(traitSummary)}` : '',
    rarityText
  ].filter(Boolean).join('<br/>');

  push('AI', lines);
}

function resolveNFTImage(nft){
  if(!nft?.image) return DEFAULT_PFP;

  if(typeof nft.image === 'string') return nft.image;

  if(nft.image.cid && nft.image.file){
    return `https://gold-junior-swordfish-840.mypinata.cloud/ipfs/${nft.image.cid}/${encodeURIComponent(nft.image.file)}`;
  }

  return DEFAULT_PFP;
}

/* ---------------- NFT SELECTOR -------------------------------------------------rarity call--------------------------- */
function renderNFTSelector(nfts, activeTokenId=null){
  if(!Array.isArray(nfts) || !nfts.length) return;
  if(!nftSelectorEl) return;
  nftSelectorEl.innerHTML = '';

  nfts.forEach(nft=>{
  const rarity = getRarityFromTable(nft.tokenId);

  const wrapper = document.createElement('div');
  wrapper.className = 'nft-item';

  const img = document.createElement('img');
  img.src =
  typeof nft.image === 'string'
    ? nft.image
    : nft.image?.cid && nft.image?.file
      ? `https://gold-junior-swordfish-840.mypinata.cloud/ipfs/${nft.image.cid}/${encodeURIComponent(nft.image.file)}`
      : DEFAULT_PFP;
  img.title = nft.name;
  img.className = 'nft-thumb';
  if(activeTokenId && nft.tokenId === activeTokenId){
    img.classList.add('selected');
  }
  img.onclick = ()=>selectNFT(nft);

  // Badge with % (from rarity table)
const badge = document.createElement('div');
badge.className = 'rarity-badge';
badge.style.backgroundColor = rarity.color;

const label = document.createElement('span');
label.className = 'rarity-label';
label.textContent = rarity.label;

badge.appendChild(label);

if (rarity.percent != null) {
  const pct = document.createElement('span');
  pct.className = 'rarity-percent';
  pct.textContent = `${rarity.percent.toFixed(2)}%`;
  badge.appendChild(pct);
}

//--------------
const tags = document.createElement('div');
tags.className = 'trait-tags';

(nft.traits || []).slice(0, 3).forEach(t => {
  const tag = document.createElement('span');
  tag.className = 'trait-tag';
  tag.textContent = t.trait_type;
  tags.appendChild(tag);
});
  wrapper.appendChild(img);
  wrapper.appendChild(badge);
  //wrapper.appendChild(tags);
  nftSelectorEl.appendChild(wrapper);
});

  if(!activeNFT && nfts[0]) selectNFT(nfts[0], true);

  appendCollectNewButton(nftSelectorEl);
}


function selectNFT(nft, silent = false){
  if(activeNFT?.tokenId === nft.tokenId) return;
  activeNFT = nft;
  CONFIG.NFT_TOKEN_ID = nft.tokenId;
  updateFloatingAvatar(nft?.tokenId);

  // ✅ replace placeholder ONLY after verified NFT selection
  if (pfpImg && nft?.image) {
  pfpImg.src = resolveNFTImage(nft);
  }

  if (userAddress) localStorage.setItem('activeNFT:' + userAddress, nft.tokenId);

  if(nftDropdown){
    nftDropdown.classList.add('hidden');
  }

  // Highlight selected thumbnail
  if(nftSelectorEl){
    [...nftSelectorEl.children].forEach(img=>{
      img.classList.toggle(
        'selected',
        img.title === nft.name
      );
    });
  }

  if(!silent){
    push(
      'System',

/* ---------------- WALLET ---------------- */
async function connectWallet(){
  if(!window.ethereum) return alert('No Ethereum wallet detected');

  const accounts = await ethereum.request({ method:'eth_requestAccounts' });
  if(!accounts.length) return;

  web3Provider = new ethers.providers.Web3Provider(window.ethereum);
  signer = web3Provider.getSigner();
  userAddress = accounts[0].toLowerCase();

  connectBtn.textContent = 'Authenticating wallet…';
  connectBtn.disabled = true;
  try {
    await authenticateAndFetchNFT();
    connectBtn.classList.remove('blink');
    connectBtn.textContent = `Authenticated: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
  } catch (err) {
    hasNFTAccess = false; inputEl.disabled = true; sendBtn.disabled = true;
    connectBtn.textContent = 'Connect Wallet';
    connectBtn.classList.add('blink');
    push('System', escapeHtml(err.message || 'Wallet sign-in failed'));
  } finally { connectBtn.disabled = false; }
}

/* Silent restore */
async function restoreWalletConnection(){
  if(!window.ethereum) return;

  const accounts = await ethereum.request({ method:'eth_accounts' });
  if(!accounts.length) return;

  web3Provider = new ethers.providers.Web3Provider(window.ethereum);

  connectBtn.textContent = `Wallet detected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)} (sign in)`;

/* ---------------- AUTH ---------------- */
async function authenticateAndFetchNFT(){
  if(!userAddress || !signer) return;
  const challengeResp = await fetch(`${CONFIG.API_BASE}/api/auth/challenge`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({address:userAddress}), credentials:'include'
  });
  const challenge = await challengeResp.json();
  if(!challengeResp.ok) throw new Error(challenge.error || 'Challenge failed');
  const signature = await signer.signMessage(challenge.message);
  const r = await fetch(`${CONFIG.API_BASE}/api/auth`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({address:userAddress,nonce:challenge.nonce,signature}), credentials:'include'
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error || 'Authentication failed');
  handleNFTAuth(data);
  if(data.returning) push('System','Welcome back, collector! Your Cyberpets collection has been synchronized. Your saved preferences are available when Memory is enabled.');
  if(data.activities?.length){
    const activity = data.activities.slice(0,10);
    const summary = activity.map(a => `${a.direction === 'received' ? 'Received' : 'Sent'} Cyberpet #${escapeHtml(a.tokenId)}`).join('; ');
    push('System', `Collection changes since your last connection: ${summary}${data.activities.length > 10 ? ' (and more)' : ''}. These are ownership changes, not verified sales.`);
    const ids = data.activities.map(a=>a.id);
    if(confirm(`CyberpetsAI detected ${ids.length} unacknowledged collection change(s). Mark as seen?`)){
      await fetch(`${CONFIG.API_BASE}/api/activity/acknowledge`, {method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
    }
  }
}

function handleNFTAuth(data){
  ownedNFTs = Array.isArray(data?.nfts) ? data.nfts : [];

  if(!ownedNFTs.length){
    if(hasNFTAccess || !authAnnounced){
      hasNFTAccess = false;
      authAnnounced = true;

      inputEl.disabled = true;
      sendBtn.disabled = true;

        if (pfpImg) {
        pfpImg.src = DEFAULT_PFP;
      }

      push('System', `
        You need a <b>CyberpetsAi NFT</b> to continue.<br/><br/>
        <a href="https://opensea.io/collection/cyberpetsai" target="_blank"
           style="display:inline-block;padding:10px 14px;border-radius:12px;
           background:linear-gradient(135deg,#06b6d4,#7c3aed);
           color:white;font-weight:700;text-decoration:none;">
           Go To NFTs
        </a>
      `);
    }
    return;
  }

  if(!hasNFTAccess){
    hasNFTAccess = true;
    authAnnounced = true;

    inputEl.disabled = false;
    sendBtn.disabled = false;

    const storedToken = localStorage.getItem('activeNFT:' + userAddress);
    renderNFTSelector(ownedNFTs, storedToken || data.activeTokenId);

    push('System', `Chat unlocked — ${ownedNFTs.length} Cyberpets verified 🐾`);
  }
}

async function restoreSession(){
  if(!CONFIG.ENABLE_SESSION_RESTORE) return; // ⬅️ prevent 404

  try{
    const r = await fetch('/api/session',{ credentials:'include' });
    if(!r.ok) return;

    const data = await r.json();
    if (!userAddress || data.address.toLowerCase() !== userAddress.toLowerCase()) return;
    ownedNFTs = data.nfts || [];

    connectBtn.classList.remove('blink');
    connectBtn.textContent =
      `Authenticated: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;

    const storedToken = localStorage.getItem('activeNFT:' + userAddress);
    renderNFTSelector(ownedNFTs, storedToken || data.activeTokenId);

    hasNFTAccess = ownedNFTs.length > 0;
    inputEl.disabled = !hasNFTAccess;
    sendBtn.disabled = !hasNFTAccess;

    push('System','Session restored — welcome back 🐾');
  }catch{}
}

 }catch(e){advStatus(e.message);}

document.getElementById('memoryBtn').onclick=async()=>{
  try{
    const r=await fetch(`${CONFIG.API_BASE}/api/memory`,{credentials:'include'});
    if(!r.ok){push('System','Connect and sign your wallet to manage memory.');return;}
    const memory=await r.json();
    const choice=prompt(`Collector Memory: ${memory.enabled?'ON':'OFF'}\nSaved notes: ${memory.notes.length}\n\n1 = Enable\n2 = Disable\n3 = View notes\n4 = Clear notes\n\nTo save a note, send: remember: your preference\nTo remove all notes, send: forget my memories`);
    if(choice==='1'||choice==='2'){
      const update=await fetch(`${CONFIG.API_BASE}/api/memory`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:choice==='1'})});
      if(!update.ok)throw new Error('Unable to change memory settings');
      push('System',choice==='1'?'Long-term memory enabled. Use “remember: ...” to save a short note.':'Long-term memory disabled. Existing notes are retained but not sent to the AI.');
    }else if(choice==='3'){
      alert(memory.notes.length?memory.notes.map((n,i)=>`${i+1}. ${n}`).join('\n'):'No saved memory notes.');
    }else if(choice==='4'&&confirm('Permanently clear all saved collector memory notes?')){
      const del=await fetch(`${CONFIG.API_BASE}/api/memory`,{method:'DELETE',credentials:'include'});
      if(!del.ok)throw new Error('Unable to clear notes');
      push('System','Saved collector memory notes cleared.');
    }
  }catch(e){push('System',escapeHtml(e.message||'Memory settings unavailable'));}
};
